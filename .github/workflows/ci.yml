name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sandbox:
    name: sandbox (mock, ${{ matrix.workflow }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, ja]
        workflow: [flash-default, ddd-rust-default, ddd-typescript-default]
    env:
      TAKT_VERSION: 0.66.0
      BUN_VERSION: 1.4.2
      T0_BUDGET_BYTES: "25000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install TAKT
        run: npm install -g "takt@${TAKT_VERSION}"
      # ddd-lint ships the Rust extractor for darwin-arm64 only; build it for this runner.
      - name: Build the ddd-lint Rust extractor
        if: matrix.workflow == 'ddd-rust-default'
        run: bun tools/ddd-lint/build-extractor.ts
      # Installs the bundle into a fresh git project with project-closed configuration and an
      # empty TAKT_CONFIG_DIR, runs takt workflow doctor, runs the workflow on the mock
      # provider, and checks step routing, the happy path, and the companions.
      - name: Sandbox verification (mock provider)
        run: scripts/sandbox-verify.sh --mode mock --lang "${{ matrix.lang }}" --workflow "${{ matrix.workflow }}" --dir "$RUNNER_TEMP/sandbox" --keep
      - name: T0 context budget
        if: matrix.workflow == 'flash-default'
        run: |
          project="$RUNNER_TEMP/sandbox/project"
          builtin="$(npm root -g)/takt/builtins/${{ matrix.lang }}/facets"
          common=(
            "$builtin/policies/contract-change.md"
            "$project/.takt/facets/policies/coding-lite.md"
            "$project/.takt/facets/policies/testing-lite.md"
            "$builtin/knowledge/implementation-semantics.md"
          )
          echo "== write_tests"
          node scripts/check-facet-budget.mjs "$T0_BUDGET_BYTES" "${common[@]}" "$project/.takt/facets/instructions/write-tests-flash.md"
          echo "== implement / reimplement"
          node scripts/check-facet-budget.mjs "$T0_BUDGET_BYTES" "${common[@]}" "$project/.takt/facets/instructions/implement-flash.md"
      - name: Upload sandbox report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ matrix.workflow }}-${{ matrix.lang }}
          path: |
            ${{ runner.temp }}/sandbox/report.md
            ${{ runner.temp }}/sandbox/run.log
            ${{ runner.temp }}/sandbox/doctor.log
          if-no-files-found: ignore

  scripts:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'scripts/**/*.test.mjs'

  ddd-lint:
    name: ddd-lint (typecheck, bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ddd-lint
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The Rust samples need the extractor, which ships for darwin-arm64 only.
      - run: bun build-extractor.ts
      - run: bun test
