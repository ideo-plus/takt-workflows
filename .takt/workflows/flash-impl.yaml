name: flash-impl
description: builtin default と同じ development-core 構成で、テスト生成・実装を DGX Spark 上の Flash 級モデル（T0）から始め、失敗時に T1 → T2 へ昇格する開発ワークフロー。provider の実体は runtime.yaml の ladder で解決する。
max_steps: 51
initial_step: develop

# provider / model は workflow YAML では指定できない（TAKT 0.66 の契約。promotion も `{at: N}` のみ）。
# tier の実体は runtime.yaml で与える。<t0-code> <t0-impl> <t1> <t2> は利用環境の profile 名へ置き換える。
#
#   version: 1
#   companion:
#     enabled: true
#   provider:
#     defaults: { profile: <t2> }          # plan / replan / peer-review 以下全 step / final gate
#     profiles:
#       <t0-code>: { provider: ..., model: ... }
#       <t0-impl>: { provider: ..., model: ... }
#       <t1>:      { provider: ..., model: ... }
#       <t2>:      { provider: ..., model: ... }
#     targets:
#       steps:
#         development-core/write_tests:        { ladder: [<t0-code>, <t1>, <t2>] }
#         flash-implement-dynamic/implement:   { ladder: [<t0-impl>, <t1>, <t2>] }
#         flash-implement-dynamic/reimplement: { ladder: [<t0-impl>, <t2>] }
#         flash-remediation-dynamic/fix:       { ladder: [<t1>, <t2>] }
#       internal_agents:
#         selector: { profile: <t1> }          # dynamic_facets selector（構造化出力対応の provider に固定）
#       companions:
#         ai-antipattern-review-companion: { profile: <t1> }
#         testing-review-companion:        { profile: <t1> }
#         review-companion-moderator:      { profile: <t1> }
#
# write_tests の promotion は、builtin development-core をコピーせず、project 層の step fragment
# `.takt/steps/development-core-write-tests.yaml`（builtin fragment の shadowing + promotion 追加）で宣言している。
# 詳細は workflow-maker-doctor.md を参照。

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: flash-implement-dynamic
      remediation_workflow: flash-remediation-dynamic
      plan_instruction: plan-flash
      plan_report_format: scenario-based-plan
      replan_instruction: replan-flash
      testing_policy:
        - coding-lite
        - testing-lite
      testing_knowledge:
        - implementation-semantics
      testing_instruction: write-tests-flash
      testing_report_format: scenario-based-test-report
      development_policy:
        - coding-lite
        - testing-lite
      development_knowledge:
        - implementation-semantics
      implementation_instruction: implement-flash
      reimplementation_instruction: implement-flash
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      reviewer_suite: development-review
      review_policy_additions: []
      review_policy:
        - coding
        - testing
        - review
        - architecture
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
