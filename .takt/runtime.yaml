# TAKT provider configuration for the flash-default bundle, closed to one project.
# scripts/use-lang.sh copies this file to <project>/.takt/runtime.yaml when none exists.
# Commit it: TAKT runs tasks in worktree clones, and the whole team should use the same tiers.
#
# Profiles (provider + model) and step assignments both live here, so nothing depends on
# ~/.takt/runtime.yaml. The profiles below are the ones verified in full runs; replace them
# with what your environment provides. Keep the profile NAMES, the step assignments use them.
# gpt-6.1-sol, the top Codex model (gpt-6-astra ranks next), needs TAKT 0.67 or later: the Codex
# CLI that TAKT 0.66 bundles rejects it for ChatGPT accounts.
#
# Note: TAKT accepts a non-loopback base_url (e.g. a DGX Spark on the LAN) only in the
# "global" runtime.yaml. To keep that per project too, point TAKT_CONFIG_DIR at a directory
# inside the project (see the README) instead of using ~/.takt.
version: 1
companion:
  enabled: true
provider:
  defaults: { profile: t2 }
  profiles:
    # T0: Flash-class models for closed, well-specified work
    t0-test-code:       { provider: codex, model: gpt-5.6-sol }
    t0-production-code: { provider: codex, model: gpt-5.6-sol }
    # T1: mid-size model with structured output (companions and the facet selector need it);
    # gpt-6-astra ranks next to gpt-6.1-sol
    t1: { provider: codex, model: gpt-6-astra }
    # T2: strongest general model; default for every step not listed below. gpt-6.1-sol defaults to
    # reasoning_effort low, so the effort is stated
    t2: { provider: codex, model: gpt-6.1-sol, options: { reasoning_effort: medium } }
    # T3 (optional): planning and sign-off, the low-token high-leverage judgments
    t3-plan:  { provider: codex, model: gpt-6.1-sol, options: { reasoning_effort: high } }
    t3-judge: { provider: codex, model: gpt-6.1-sol, options: { reasoning_effort: high } }
  targets:
    steps:
      # T3 (optional): remove these four lines to run them on t2 instead
      development-core/plan:                     { profile: t3-plan }
      development-core/replan:                   { profile: t3-plan }
      peer-review/review-adjudication:           { profile: t3-judge }
      peer-review/final-gate:                    { profile: t3-judge }
      # Tiers
      development-core/write_tests:              { ladder: [t0-test-code, t1, t2] }
      flash-implement-dynamic/implement:         { profile: t0-production-code }
      flash-implement-dynamic/reimplement:       { profile: t1 }
      flash-implement-dynamic/reimplement_final: { profile: t2 }
      flash-remediation-dynamic/fix:             { ladder: [t1, t2] }
    internal_agents:
      selector: { profile: t1 }
    companions:
      ai-antipattern-review-companion: { profile: t1 }
      testing-review-companion:        { profile: t1 }
      review-companion-moderator:      { profile: t1 }
