bounded_contexts:
- element_id: bc.reservation
  name: 会議室予約
  aggregates:
  - element_id: aggregate.reservation
    name: 予約
    bounded_context: bc.reservation
    root_element: entity.reservation
    states:
    - confirmed
    - cancelled
    elements:
    - element_id: entity.reservation
      kind: entity
      name: Reservation
      aggregate: aggregate.reservation
      attributes:
      - name: id
        type: primitive.reservation-id
        required: true
      - name: memberId
        type: primitive.member-id
        required: true
      - name: roomId
        type: primitive.room-id
        required: true
      - name: startsAt
        type: decimal
        required: true
      - name: endsAt
        type: decimal
        required: true
      - name: status
        type: string
        required: true
    - element_id: primitive.reservation-id
      kind: domain-primitive
      name: ReservationId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: primitive.member-id
      kind: domain-primitive
      name: MemberId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: primitive.room-id
      kind: domain-primitive
      name: RoomId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    invariants:
    - element_id: invariant.reservation.reservation-id-positive-integer
      name: 予約IDの正整数条件
      aggregate: aggregate.reservation
      element: primitive.reservation-id
      statement: 予約IDは1以上の整数である
    - element_id: invariant.reservation.member-id-positive-integer
      name: 会員IDの正整数条件
      aggregate: aggregate.reservation
      element: primitive.member-id
      statement: 会員IDは1以上の整数である
    - element_id: invariant.reservation.room-id-positive-integer
      name: 会議室IDの正整数条件
      aggregate: aggregate.reservation
      element: primitive.room-id
      statement: 会議室IDは1以上の整数である
    - element_id: invariant.reservation.time-slot-order
      name: 予約時間の順序
      aggregate: aggregate.reservation
      element: entity.reservation
      statement: 開始と終了は有限の時刻であり、終了は開始より後である
    - element_id: invariant.reservation.cancel-once
      name: 取消は一度だけ
      aggregate: aggregate.reservation
      element: entity.reservation
      statement: 確定済み予約だけを取消でき、取消済み予約の取消は失敗する
    commands:
    - element_id: command.reservation.cancel
      name: CancelReservation
      aggregate: aggregate.reservation
      effect: transition
      state_effect: transitions
      transitions:
      - transition.reservation.cancel
      domain_errors:
      - element_id: error.reservation.cancel.already-cancelled
        name: AlreadyCancelled
        operation: command.reservation.cancel
        condition: 予約が取消済みである
      event: event.reservation.cancelled
      idempotency:
        strategy: none
    events:
    - element_id: event.reservation.reserved
      name: ReservationReserved
      aggregate: aggregate.reservation
      produced_by: factory.reservation.reserve
    - element_id: event.reservation.cancelled
      name: ReservationCancelled
      aggregate: aggregate.reservation
      produced_by: command.reservation.cancel
    transitions:
    - element_id: transition.reservation.cancel
      name: 予約取消
      aggregate: aggregate.reservation
      from_state: confirmed
      to_state: cancelled
      command: command.reservation.cancel
    factory_rules:
    - element_id: factory.reservation.reserve
      name: Reserve
      target_element: entity.reservation
      preconditions:
      - invariant.reservation.time-slot-order
      domain_errors:
      - element_id: error.reservation.reserve.invalid-time-slot
        name: InvalidTimeSlot
        operation: factory.reservation.reserve
        condition: 時刻が有限値でない、または終了が開始より後でない
    - element_id: factory.reservation.parse-reservation-id
      name: ParseReservationId
      target_element: primitive.reservation-id
      preconditions:
      - invariant.reservation.reservation-id-positive-integer
      domain_errors:
      - element_id: error.reservation.parse-reservation-id.invalid-id
        name: InvalidReservationId
        operation: factory.reservation.parse-reservation-id
        condition: 入力が1以上の整数でない
    - element_id: factory.reservation.parse-member-id
      name: ParseMemberId
      target_element: primitive.member-id
      preconditions:
      - invariant.reservation.member-id-positive-integer
      domain_errors:
      - element_id: error.reservation.parse-member-id.invalid-id
        name: InvalidMemberId
        operation: factory.reservation.parse-member-id
        condition: 入力が1以上の整数でない
    - element_id: factory.reservation.parse-room-id
      name: ParseRoomId
      target_element: primitive.room-id
      preconditions:
      - invariant.reservation.room-id-positive-integer
      domain_errors:
      - element_id: error.reservation.parse-room-id.invalid-id
        name: InvalidRoomId
        operation: factory.reservation.parse-room-id
        condition: 入力が1以上の整数でない
lineage: []
