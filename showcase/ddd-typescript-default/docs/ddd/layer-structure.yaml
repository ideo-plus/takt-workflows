model_ref: domain-model.yaml
layer_structures:
- context_ref: bc.reservation
  cqrs: false
  packages:
  - role: command
    code:
      language: typescript
      package: '@acme/reservation-domain'
  - role: command
    code:
      language: typescript
      package: '@acme/reservation-use-case'
  - role: command
    code:
      language: typescript
      package: '@acme/reservation-interface-adapter'
  dependencies:
  - code:
      language: typescript
      package: '@acme/reservation-domain'
    depends_on:
    - language: typescript
      package: '@acme/language-extensions'
  - code:
      language: typescript
      package: '@acme/reservation-use-case'
    depends_on:
    - language: typescript
      package: '@acme/reservation-domain'
    - language: typescript
      package: '@acme/language-extensions'
  - code:
      language: typescript
      package: '@acme/reservation-interface-adapter'
    depends_on:
    - language: typescript
      package: '@acme/reservation-domain'
    - language: typescript
      package: '@acme/reservation-use-case'
    - language: typescript
      package: '@acme/language-extensions'
  ports:
  - name: ReservationRepository
    kind: repository
    verbs:
    - findById
    - store
  repositories:
  - name: ReservationRepository
    aggregate_ref: aggregate.reservation
    io_unit: single
    verbs:
    - findById
    - store
    store_semantics: append-only
  restoration_paths:
  - aggregate_ref: aggregate.reservation
    via: event-replay
  persistence_backend: in-memory
- context_ref: bc.access
  cqrs: false
  packages:
    - role: command
      code:
        language: typescript
        package: "@acme/access-domain"
  dependencies:
    - code:
        language: typescript
        package: "@acme/access-domain"
      depends_on:
        - language: typescript
          package: "@acme/language-extensions"
  ports:
    []
  repositories:
    []
  restoration_paths:
    - aggregate_ref: aggregate.organization
      via: event-replay
    - aggregate_ref: aggregate.user
      via: event-replay
  persistence_backend: none
