model_ref: domain-model.yaml
aggregate_mappings:
- aggregate_ref: aggregate.reservation
  programming_model: class
  persistence_method: event-sourcing
  reference_ids:
  - entity.reservation
  - primitive.reservation-id
  - primitive.member-id
  - primitive.room-id
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - reservation
    type: Reservation
  operations:
  - operation_ref: factory.reservation.reserve
    code:
      method: reserve
      error_type: ReserveReservationError
    errors:
    - error_ref: error.reservation.reserve.invalid-time-slot
      code:
        case: invalid-time-slot
  - operation_ref: factory.reservation.parse-reservation-id
    code:
      method: parse
      error_type: ParseReservationIdError
    errors:
    - error_ref: error.reservation.parse-reservation-id.invalid-id
      code:
        case: invalid-id
  - operation_ref: factory.reservation.parse-member-id
    code:
      method: parse
      error_type: ParseMemberIdError
    errors:
    - error_ref: error.reservation.parse-member-id.invalid-id
      code:
        case: invalid-id
  - operation_ref: factory.reservation.parse-room-id
    code:
      method: parse
      error_type: ParseRoomIdError
    errors:
    - error_ref: error.reservation.parse-room-id.invalid-id
      code:
        case: invalid-id
  - operation_ref: command.reservation.cancel
    code:
      method: cancel
      success_type: CancelReservationOutcome
      error_type: CancelReservationError
    errors:
    - error_ref: error.reservation.cancel.already-cancelled
      code:
        case: already-cancelled
  replay_methods:
  - event_ref: event.reservation.reserved
    code:
      method: fromReserved
  - event_ref: event.reservation.cancelled
    code:
      method: applyCancelled
- aggregate_ref: aggregate.organization
  programming_model: class
  persistence_method: event-sourcing
  reference_ids:
    - entity.organization
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
      - organization
    type: Organization
  operations:
    - operation_ref: factory.organization.create
      code:
        method: create
        error_type: CreateOrganizationError
      errors:
        - error_ref: error.organization.create.invalid-input
          code:
            case: invalid-input
  replay_methods:
    - event_ref: event.organization.created
      code:
        method: fromCreated
- aggregate_ref: aggregate.user
  programming_model: class
  persistence_method: event-sourcing
  reference_ids:
    - entity.user
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
      - user
    type: User
  operations:
    - operation_ref: factory.user.create
      code:
        method: create
        error_type: CreateUserError
      errors:
        - error_ref: error.user.create.invalid-input
          code:
            case: invalid-input
  replay_methods:
    - event_ref: event.user.created
      code:
        method: fromCreated
domain_packages:
- term: 会議室予約
  model_refs:
  - bc.reservation
  rationale: 予約の業務モデルを公開する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module: []
- term: 予約
  model_refs:
  - aggregate.reservation
  rationale: 予約の生成と取消を所有する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - reservation
- term: 予約ID
  model_refs:
  - primitive.reservation-id
  rationale: 予約を識別する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - reservation
    - reservation-id
- term: 会員ID
  model_refs:
  - primitive.member-id
  rationale: 予約した会員を識別する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - member-id
- term: 会議室ID
  model_refs:
  - primitive.room-id
  rationale: 予約した会議室を識別する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - room-id
- term: 予約操作
  model_refs:
  - bc.reservation
  rationale: 予約のユースケースと保存ポートを公開する
  code:
    language: typescript
    package: '@acme/reservation-use-case'
    module: []
- term: 予約取消
  model_refs:
  - command.reservation.cancel
  rationale: 対象予約を読み込み取消後に保存する
  code:
    language: typescript
    package: '@acme/reservation-use-case'
    module:
    - cancel-reservation
- term: 予約の保存と読込
  model_refs:
  - aggregate.reservation
  rationale: 予約を扱う保存ポートを宣言する
  code:
    language: typescript
    package: '@acme/reservation-use-case'
    module:
    - reservation-repository
- term: 予約の保存実装
  model_refs:
  - aggregate.reservation
  rationale: 予約の保存アダプタを公開する
  code:
    language: typescript
    package: '@acme/reservation-interface-adapter'
    module: []
- term: 予約のメモリ保存
  model_refs:
  - aggregate.reservation
  rationale: 予約ごとのイベント列と最新のスナップショットを保持し、スナップショットより後のイベントを再生して集約を返す
  code:
    language: typescript
    package: '@acme/reservation-interface-adapter'
    module:
    - in-memory-reservation-repository
- term: 利用資格
  model_refs:
    - bc.access
    - aggregate.organization
    - aggregate.user
    - service.access-eligibility
  rationale: 利用組織と利用者の独立した判断、および両者を組み合わせる利用資格を一緒に理解するパッケージ。言語拡張の結果型だけに依存する
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      []
- term: 利用資格
  model_refs:
    - aggregate.organization
    - aggregate.user
    - service.access-eligibility
  rationale: 独立した利用組織と利用者、および両者の判断を組み合わせるサービスを一つの業務モジュールで理解する。集約間の所有関係は追加しない
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
- term: 利用組織
  model_refs:
    - aggregate.organization
  rationale: 組織の同一性、有効性、構築と復元をまとめ、利用者には依存しない
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
      - organization
- term: 利用者
  model_refs:
    - aggregate.user
  rationale: 利用者の同一性、利用可否、所属をまとめ、所属判断の一時引数として利用組織へ依存する
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
      - user
- term: 利用資格判定
  model_refs:
    - service.access-eligibility
  rationale: 利用組織と利用者の判断を組み合わせる。両モジュールへ依存するが、入力集約を保持しない
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
      - access-eligibility
service_mappings:
- service_ref: service.access-eligibility
  code:
    language: typescript
    package: "@acme/access-domain"
    module:
      - access
      - access-eligibility
    type: AccessEligibility
  operations:
    - operation_ref: service-operation.access-eligibility.assess
      code:
        method: assess
        success_type: boolean
        error_type: AssessAccessEligibilityError
      inputs:
        - input: organization
          parameter: organization
        - input: user
          parameter: user
      errors:
        - error_ref: error.access-eligibility.assess.organization-inactive
          code:
            case: organization-inactive
        - error_ref: error.access-eligibility.assess.organization-mismatch
          code:
            case: organization-mismatch
        - error_ref: error.access-eligibility.assess.user-unavailable
          code:
            case: user-unavailable
