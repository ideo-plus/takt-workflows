model_ref: domain-model.yaml
aggregate_mappings:
- aggregate_ref: aggregate.reservation
  programming_model: class
  persistence_method: event-sourcing
  reference_ids:
  - entity.reservation
  - primitive.reservation-id
  - primitive.member-id
  - primitive.room-id
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - reservation
    type: Reservation
  operations:
  - operation_ref: factory.reservation.reserve
    code:
      method: reserve
      error_type: ReserveReservationError
    errors:
    - error_ref: error.reservation.reserve.invalid-time-slot
      code:
        case: invalid-time-slot
  - operation_ref: factory.reservation.parse-reservation-id
    code:
      method: parse
      error_type: ParseReservationIdError
    errors:
    - error_ref: error.reservation.parse-reservation-id.invalid-id
      code:
        case: invalid-id
  - operation_ref: factory.reservation.parse-member-id
    code:
      method: parse
      error_type: ParseMemberIdError
    errors:
    - error_ref: error.reservation.parse-member-id.invalid-id
      code:
        case: invalid-id
  - operation_ref: factory.reservation.parse-room-id
    code:
      method: parse
      error_type: ParseRoomIdError
    errors:
    - error_ref: error.reservation.parse-room-id.invalid-id
      code:
        case: invalid-id
  - operation_ref: command.reservation.cancel
    code:
      method: cancel
      success_type: CancelReservationOutcome
      error_type: CancelReservationError
    errors:
    - error_ref: error.reservation.cancel.already-cancelled
      code:
        case: already-cancelled
  replay_methods:
  - event_ref: event.reservation.reserved
    code:
      method: fromReserved
  - event_ref: event.reservation.cancelled
    code:
      method: applyCancelled
domain_packages:
- term: 会議室予約
  model_refs:
  - bc.reservation
  rationale: 予約の業務モデルを公開する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module: []
- term: 予約
  model_refs:
  - aggregate.reservation
  rationale: 予約の生成と取消を所有する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - reservation
- term: 予約ID
  model_refs:
  - primitive.reservation-id
  rationale: 予約を識別する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - reservation
    - reservation-id
- term: 会員ID
  model_refs:
  - primitive.member-id
  rationale: 予約した会員を識別する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - member-id
- term: 会議室ID
  model_refs:
  - primitive.room-id
  rationale: 予約した会議室を識別する
  code:
    language: typescript
    package: '@acme/reservation-domain'
    module:
    - room-id
- term: 予約操作
  model_refs:
  - bc.reservation
  rationale: 予約のユースケースと保存ポートを公開する
  code:
    language: typescript
    package: '@acme/reservation-use-case'
    module: []
- term: 予約取消
  model_refs:
  - command.reservation.cancel
  rationale: 対象予約を読み込み取消後に保存する
  code:
    language: typescript
    package: '@acme/reservation-use-case'
    module:
    - cancel-reservation
- term: 予約の保存と読込
  model_refs:
  - aggregate.reservation
  rationale: 予約を扱う保存ポートを宣言する
  code:
    language: typescript
    package: '@acme/reservation-use-case'
    module:
    - reservation-repository
- term: 予約の保存実装
  model_refs:
  - aggregate.reservation
  rationale: 予約の保存アダプタを公開する
  code:
    language: typescript
    package: '@acme/reservation-interface-adapter'
    module: []
- term: 予約のメモリ保存
  model_refs:
  - aggregate.reservation
  rationale: 予約ごとのイベント列を追記保存し、再生して集約を返す
  code:
    language: typescript
    package: '@acme/reservation-interface-adapter'
    module:
    - in-memory-reservation-repository
