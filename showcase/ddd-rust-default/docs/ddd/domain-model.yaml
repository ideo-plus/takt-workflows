bounded_contexts:
- element_id: bc.reservation
  name: 会議室予約
  aggregates:
  - element_id: aggregate.reservation
    name: 予約
    bounded_context: bc.reservation
    root_element: entity.reservation
    states:
    - confirmed
    - cancelled
    elements:
    - element_id: entity.reservation
      kind: entity
      name: Reservation
      aggregate: aggregate.reservation
      attributes:
      - name: id
        type: primitive.reservation-id
        required: true
      - name: member_id
        type: primitive.member-id
        required: true
      - name: room_id
        type: primitive.room-id
        required: true
      - name: time_slot
        type: vo.time-slot
        required: true
    - element_id: primitive.reservation-id
      kind: domain-primitive
      name: ReservationId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: primitive.member-id
      kind: domain-primitive
      name: MemberId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: primitive.room-id
      kind: domain-primitive
      name: RoomId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: vo.time-slot
      kind: value-object
      name: TimeSlot
      aggregate: aggregate.reservation
      attributes:
      - name: start
        type: datetime
        required: true
      - name: end
        type: datetime
        required: true
    invariants:
    - element_id: invariant.reservation.reservation-id-positive
      name: 予約IDは正の整数
      aggregate: aggregate.reservation
      element: primitive.reservation-id
      statement: 予約IDは1以上の整数である
    - element_id: invariant.reservation.member-id-positive
      name: 会員IDは正の整数
      aggregate: aggregate.reservation
      element: primitive.member-id
      statement: 会員IDは1以上の整数である
    - element_id: invariant.reservation.room-id-positive
      name: 部屋IDは正の整数
      aggregate: aggregate.reservation
      element: primitive.room-id
      statement: 部屋IDは1以上の整数である
    - element_id: invariant.reservation.end-after-start
      name: 終了は開始より後
      aggregate: aggregate.reservation
      element: vo.time-slot
      statement: 時間枠の終了は開始より後である
    - element_id: invariant.reservation.cancel-once
      name: 取消は一度だけ
      aggregate: aggregate.reservation
      element: entity.reservation
      statement: confirmedからcancelledへだけ遷移し、cancelledの取消は失敗する
    commands:
    - element_id: command.reservation.cancel
      name: 予約を取り消す
      aggregate: aggregate.reservation
      effect: transition
      state_effect: transitions
      transitions:
      - transition.reservation.cancel
      domain_errors:
      - element_id: error.reservation.cancel.already-cancelled
        name: 取消済み
        operation: command.reservation.cancel
        condition: 予約の状態がcancelledである
      event: event.reservation.cancelled
      idempotency:
        strategy: none
    events:
    - element_id: event.reservation.reserved
      name: ReservationReserved
      aggregate: aggregate.reservation
      produced_by: factory.reservation.reserve
    - element_id: event.reservation.cancelled
      name: 予約が取り消された
      aggregate: aggregate.reservation
      produced_by: command.reservation.cancel
    transitions:
    - element_id: transition.reservation.cancel
      name: 予約取消
      aggregate: aggregate.reservation
      from_state: confirmed
      to_state: cancelled
      command: command.reservation.cancel
    factory_rules:
    - element_id: factory.reservation.parse-reservation-id
      name: 予約IDの検証
      target_element: primitive.reservation-id
      preconditions:
      - invariant.reservation.reservation-id-positive
      domain_errors:
      - element_id: error.reservation.parse-reservation-id.not-positive
        name: 正の整数ではない
        operation: factory.reservation.parse-reservation-id
        condition: 入力が1未満である
    - element_id: factory.reservation.parse-member-id
      name: 会員IDの検証
      target_element: primitive.member-id
      preconditions:
      - invariant.reservation.member-id-positive
      domain_errors:
      - element_id: error.reservation.parse-member-id.not-positive
        name: 正の整数ではない
        operation: factory.reservation.parse-member-id
        condition: 入力が1未満である
    - element_id: factory.reservation.parse-room-id
      name: 部屋IDの検証
      target_element: primitive.room-id
      preconditions:
      - invariant.reservation.room-id-positive
      domain_errors:
      - element_id: error.reservation.parse-room-id.not-positive
        name: 正の整数ではない
        operation: factory.reservation.parse-room-id
        condition: 入力が1未満である
    - element_id: factory.reservation.create-time-slot
      name: 時間枠を作成する
      target_element: vo.time-slot
      preconditions:
      - invariant.reservation.end-after-start
      domain_errors:
      - element_id: error.reservation.create-time-slot.end-not-after-start
        name: 終了が開始より後ではない
        operation: factory.reservation.create-time-slot
        condition: 終了が開始以前である
    - element_id: factory.reservation.reserve
      name: confirmedの予約を作成する
      target_element: entity.reservation
      preconditions:
      - invariant.reservation.end-after-start
      domain_errors:
      - element_id: error.reservation.reserve.invalid-time-slot
        name: 不正な時間枠
        operation: factory.reservation.reserve
        condition: 時間枠の終了が開始以前である
- element_id: bc.access
  name: 利用資格
  aggregates:
    - element_id: aggregate.organization
      name: 利用組織
      bounded_context: bc.access
      root_element: entity.organization
      states:
        []
      elements:
        - element_id: entity.organization
          kind: entity
          name: 利用組織
          aggregate: aggregate.organization
          attributes:
            - name: id
              type: string
              required: true
            - name: active
              type: boolean
              required: true
      invariants:
        - element_id: invariant.organization.complete-input
          name: 完全な現在入力
          aggregate: aggregate.organization
          element: entity.organization
          statement: 識別子と現在の有効性が存在する。識別子の空文字と無効状態は許容する。
        - element_id: invariant.organization.identity
          name: 組織の同一性
          aggregate: aggregate.organization
          element: entity.organization
          statement: 組織の同一性は識別子で決まり、判定によって識別子も現在状態も変わらない
      commands:
        []
      events:
        - element_id: event.organization.created
          name: 利用組織が構築された
          aggregate: aggregate.organization
          produced_by: factory.organization.create
      transitions:
        []
      factory_rules:
        - element_id: factory.organization.create
          name: 利用組織を構築する
          target_element: entity.organization
          preconditions:
            - invariant.organization.complete-input
          domain_errors:
            - element_id: error.organization.create.missing-id
              name: MissingId
              operation: factory.organization.create
              condition: 識別子が存在しない。
            - element_id: error.organization.create.missing-active
              name: MissingActive
              operation: factory.organization.create
              condition: 現在の有効性が存在しない。
    - element_id: aggregate.user
      name: 利用者
      bounded_context: bc.access
      root_element: entity.user
      states:
        []
      elements:
        - element_id: entity.user
          kind: entity
          name: 利用者
          aggregate: aggregate.user
          attributes:
            - name: id
              type: string
              required: true
            - name: organization_id
              type: string
              required: true
            - name: available
              type: boolean
              required: true
      invariants:
        - element_id: invariant.user.complete-input
          name: 完全な現在入力
          aggregate: aggregate.user
          element: entity.user
          statement: 識別子、所属組織識別子、現在の利用可否が存在する。識別子の空文字と利用不可状態は許容する。
        - element_id: invariant.user.identity-and-membership
          name: 利用者の同一性と所属参照
          aggregate: aggregate.user
          element: entity.user
          statement: 利用者の同一性は識別子で決まり、所属組織は識別子だけで参照し、判定によって属性は変わらない
      commands:
        []
      events:
        - element_id: event.user.created
          name: 利用者が構築された
          aggregate: aggregate.user
          produced_by: factory.user.create
      transitions:
        []
      factory_rules:
        - element_id: factory.user.create
          name: 利用者を構築する
          target_element: entity.user
          preconditions:
            - invariant.user.complete-input
          domain_errors:
            - element_id: error.user.create.missing-id
              name: MissingId
              operation: factory.user.create
              condition: 利用者識別子が存在しない。
            - element_id: error.user.create.missing-organization-id
              name: MissingOrganizationId
              operation: factory.user.create
              condition: 所属組織識別子が存在しない。
            - element_id: error.user.create.missing-available
              name: MissingAvailable
              operation: factory.user.create
              condition: 現在の利用可否が存在しない。
  domain_services:
    - element_id: service.access-eligibility
      name: 利用資格判定
      bounded_context: bc.access
      responsibility: 各集約に判断を依頼し、指定組織に対する利用資格と拒否理由を判定する。
      operations:
        - element_id: service-operation.access-eligibility.assess
          name: 利用資格を判定する
          service: service.access-eligibility
          inputs:
            - name: organization
              type: entity.organization
            - name: user
              type: entity.user
          result:
            type: boolean
          statement: 組織が有効で、利用者がその組織に所属し、利用可能な場合だけtrueを返す。入力を変更せず、イベントを生まず、呼び出し履歴に依存しない。
          domain_errors:
            - element_id: error.access-eligibility.assess.organization-inactive
              name: 組織が無効
              operation: service-operation.access-eligibility.assess
              condition: 指定された組織が無効である。
            - element_id: error.access-eligibility.assess.organization-mismatch
              name: 所属組織が相違
              operation: service-operation.access-eligibility.assess
              condition: 利用者が指定された組織に所属しない。
            - element_id: error.access-eligibility.assess.user-unavailable
              name: 利用者が利用不可
              operation: service-operation.access-eligibility.assess
              condition: 利用者が利用不可である。
          failure_order:
            - error.access-eligibility.assess.organization-inactive
            - error.access-eligibility.assess.organization-mismatch
            - error.access-eligibility.assess.user-unavailable
lineage:
- lineage_id: lineage-0001
  element_id: factory.reservation.restore
  relation: deprecated
  successors: []
  deprecated_at: '2026-10-04'
- lineage_id: lineage-0002
  element_id: error.reservation.restore.invalid-time-slot
  relation: deprecated
  successors: []
  deprecated_at: '2026-10-04'
- lineage_id: lineage-0003
  element_id: error.organization.create.invalid-input
  previous_name: 入力が欠落
  relation: split
  successors:
    - error.organization.create.missing-id
    - error.organization.create.missing-active
  deprecated_at: 2026-10-10
- lineage_id: lineage-0004
  element_id: error.user.create.invalid-input
  previous_name: 入力が欠落
  relation: split
  successors:
    - error.user.create.missing-id
    - error.user.create.missing-organization-id
    - error.user.create.missing-available
  deprecated_at: 2026-10-10
