bounded_contexts:
- element_id: bc.reservation
  name: 会議室予約
  aggregates:
  - element_id: aggregate.reservation
    name: 予約
    bounded_context: bc.reservation
    root_element: entity.reservation
    states:
    - confirmed
    - cancelled
    elements:
    - element_id: entity.reservation
      kind: entity
      name: Reservation
      aggregate: aggregate.reservation
      attributes:
      - name: id
        type: primitive.reservation-id
        required: true
      - name: member_id
        type: primitive.member-id
        required: true
      - name: room_id
        type: primitive.room-id
        required: true
      - name: time_slot
        type: vo.time-slot
        required: true
    - element_id: primitive.reservation-id
      kind: domain-primitive
      name: ReservationId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: primitive.member-id
      kind: domain-primitive
      name: MemberId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: primitive.room-id
      kind: domain-primitive
      name: RoomId
      aggregate: aggregate.reservation
      attributes:
      - name: value
        type: integer
        required: true
    - element_id: vo.time-slot
      kind: value-object
      name: TimeSlot
      aggregate: aggregate.reservation
      attributes:
      - name: start
        type: datetime
        required: true
      - name: end
        type: datetime
        required: true
    invariants:
    - element_id: invariant.reservation.reservation-id-positive
      name: 予約IDは正の整数
      aggregate: aggregate.reservation
      element: primitive.reservation-id
      statement: 予約IDは1以上の整数である
    - element_id: invariant.reservation.member-id-positive
      name: 会員IDは正の整数
      aggregate: aggregate.reservation
      element: primitive.member-id
      statement: 会員IDは1以上の整数である
    - element_id: invariant.reservation.room-id-positive
      name: 部屋IDは正の整数
      aggregate: aggregate.reservation
      element: primitive.room-id
      statement: 部屋IDは1以上の整数である
    - element_id: invariant.reservation.end-after-start
      name: 終了は開始より後
      aggregate: aggregate.reservation
      element: vo.time-slot
      statement: 時間枠の終了は開始より後である
    - element_id: invariant.reservation.cancel-once
      name: 取消は一度だけ
      aggregate: aggregate.reservation
      element: entity.reservation
      statement: confirmedからcancelledへだけ遷移し、cancelledの取消は失敗する
    commands:
    - element_id: command.reservation.cancel
      name: 予約を取り消す
      aggregate: aggregate.reservation
      effect: transition
      state_effect: transitions
      transitions:
      - transition.reservation.cancel
      domain_errors:
      - element_id: error.reservation.cancel.already-cancelled
        name: 取消済み
        operation: command.reservation.cancel
        condition: 予約の状態がcancelledである
      event: event.reservation.cancelled
      idempotency:
        strategy: none
    events:
    - element_id: event.reservation.reserved
      name: ReservationReserved
      aggregate: aggregate.reservation
      produced_by: factory.reservation.reserve
    - element_id: event.reservation.cancelled
      name: 予約が取り消された
      aggregate: aggregate.reservation
      produced_by: command.reservation.cancel
    transitions:
    - element_id: transition.reservation.cancel
      name: 予約取消
      aggregate: aggregate.reservation
      from_state: confirmed
      to_state: cancelled
      command: command.reservation.cancel
    factory_rules:
    - element_id: factory.reservation.parse-reservation-id
      name: 予約IDの検証
      target_element: primitive.reservation-id
      preconditions:
      - invariant.reservation.reservation-id-positive
      domain_errors:
      - element_id: error.reservation.parse-reservation-id.not-positive
        name: 正の整数ではない
        operation: factory.reservation.parse-reservation-id
        condition: 入力が1未満である
    - element_id: factory.reservation.parse-member-id
      name: 会員IDの検証
      target_element: primitive.member-id
      preconditions:
      - invariant.reservation.member-id-positive
      domain_errors:
      - element_id: error.reservation.parse-member-id.not-positive
        name: 正の整数ではない
        operation: factory.reservation.parse-member-id
        condition: 入力が1未満である
    - element_id: factory.reservation.parse-room-id
      name: 部屋IDの検証
      target_element: primitive.room-id
      preconditions:
      - invariant.reservation.room-id-positive
      domain_errors:
      - element_id: error.reservation.parse-room-id.not-positive
        name: 正の整数ではない
        operation: factory.reservation.parse-room-id
        condition: 入力が1未満である
    - element_id: factory.reservation.create-time-slot
      name: 時間枠を作成する
      target_element: vo.time-slot
      preconditions:
      - invariant.reservation.end-after-start
      domain_errors:
      - element_id: error.reservation.create-time-slot.end-not-after-start
        name: 終了が開始より後ではない
        operation: factory.reservation.create-time-slot
        condition: 終了が開始以前である
    - element_id: factory.reservation.reserve
      name: confirmedの予約を作成する
      target_element: entity.reservation
      preconditions:
      - invariant.reservation.end-after-start
      domain_errors:
      - element_id: error.reservation.reserve.invalid-time-slot
        name: 不正な時間枠
        operation: factory.reservation.reserve
        condition: 時間枠の終了が開始以前である
lineage:
- lineage_id: lineage-0001
  element_id: factory.reservation.restore
  relation: deprecated
  successors: []
  deprecated_at: '2026-10-04'
- lineage_id: lineage-0002
  element_id: error.reservation.restore.invalid-time-slot
  relation: deprecated
  successors: []
  deprecated_at: '2026-10-04'
