# Project-layer shadowing of the builtin steps/development-core-write-tests.yaml.
# The write_tests step of the builtin development-core.yaml references this fragment through
# `uses: development-core-write-tests`, and fragments resolve project .takt/steps/ -> global ->
# builtin, so promotion can be injected into write_tests without copying development-core.
#
# The body mirrors the builtin; only `promotion: [{at: 2}, {at: 3}]` is added.
# runtime.yaml: development-core/write_tests -> ladder [<t0-test-code>, <t1>, <t2>]
#
# Note: because this is project-layer shadowing, every workflow in this project that uses
# development-core (including the builtin default) gets the same promotion on write_tests.
# In workflows whose runtime.yaml has no ladder for it, the promotion is a no-op (warning only).
params:
  testing_policy:
    type: facet_ref[]
    facet_kind: policy
  testing_knowledge:
    type: facet_ref[]
    facet_kind: knowledge
  testing_instruction:
    type: facet_ref
    facet_kind: instruction
  testing_report_format:
    type: facet_ref
    facet_kind: report_format
name: write_tests
capabilities: edit
tags:
  - coding
  - test-planning
edit: true
persona: coder
policy:
  - contract-change
  - $param: testing_policy
knowledge:
  $param: testing_knowledge
required_permission_mode: edit
instruction:
  $param: testing_instruction
output_contracts:
  report:
    - name: test-report.md
      format:
        $param: testing_report_format
promotion:
  - at: 2
  - at: 3
