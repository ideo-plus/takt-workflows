name: flash-implement-dynamic
description: "Copy of the builtin development-implement-dynamic. Tier escalation is unrolled into the step sequence implement (T0) -> reimplement (T1) -> reimplement_final (T2), and dynamic_facets is disabled to keep the T0 context budget."
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    reimplementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-reimplement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
# Facet arguments passed from the builtin development-core (outside this project) into this
# project workflow are rejected by TAKT's trust boundary unless they are "child-local", i.e.
# declared by name in this section map. Bundle-specific facets point at real files; builtin
# facets point at one-line `{extends:<builtin name>}` reference files.
policies:
  coding-lite: ../facets/policies/coding-lite.md
  testing-lite: ../facets/policies/testing-lite.md
knowledge:
  implementation-semantics: ../facets/knowledge/builtin-implementation-semantics.md
instructions:
  implement-flash: ../facets/instructions/implement-flash.md
report_formats:
  coder-scope: ../facets/output-contracts/builtin-coder-scope.md
# dynamic_facets is disabled for implement / reimplement, so the pool is never consulted, but the
# declaration is still required to validate the implementation_pool (facet_pool_ref) that
# development-core passes in.
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
# Tier escalation is expressed as a step sequence, not as promotion.
# A child workflow's stepIterations start empty on every workflow_call, and the only self-loop of
# implement / reimplement is the interactive_only user-input rule, so `promotion: {at: N}` never
# fires in non-interactive runs (re-entry after replan also counts as the first iteration). Each
# tier therefore gets its own step, and runtime.yaml assigns a profile per step. Re-entry after a
# replan restarts at T0, but a capability failure always goes through T1 -> T2 before returning
# need_replan to the planning side.
steps:
  - name: implement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    # runtime.yaml: flash-implement-dynamic/implement -> profile <t0-production-code>
    instruction:
      - $param: implementation_instruction
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: The required implementation was performed and its mandatory verification is complete (pre-existing failures and out-of-scope work that are neither causally related to this change nor mandatory for this task do not block completion; an incomplete label in the report alone does not justify returning it)
        next: COMPLETE
      - condition: No implementation change is needed for this task and mandatory verification is complete (report-only work; excludes any required work that has not been performed)
        next: COMPLETE
      - condition: The accepted plan is valid, but implementation, cause investigation, or mandatory verification remains incomplete and a concrete remediation is executable within the current plan (an unexecuted, failed, or unverified report alone does not require replanning)
        next: reimplement
      - condition: The accepted plan's premises, scope, method, or verification capability is defective; changing the plan would enable concrete project-local work, and leaving it unchanged prevents the requirement from being executed or verified (unexecuted, failed, unresolved, or unsupported work alone does not qualify; external-only work is excluded)
        return: need_replan
      - condition: No mandatory work can be executed under the current plan or remediation, and evidence confirms that only an external action or external answer remains, or provides a basis to believe the conditions are incompatible. Report the external constraint and unmet obligations, and pass the final continuation, replanning, or stopping decision to the planning step (choose the user-input route only when a user-input option is available and its answer would unblock the work)
        return: need_replan
      - condition: User input is required
        next: implement
        requires_user_input: true
        interactive_only: true
  - name: reimplement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    # runtime.yaml: flash-implement-dynamic/reimplement -> profile <t1>
    instruction:
      - $param: reimplementation_instruction
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: reimplementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: The missing implementation or cause investigation was completed and mandatory verification is complete (unrelated pre-existing failures and out-of-scope work do not block completion)
        next: COMPLETE
      - condition: No implementation change was needed and the previously unexecuted mandatory verification is complete (report-only work; excludes any required work that has not been performed)
        next: COMPLETE
      - condition: Implementation, cause investigation, or mandatory verification remains incomplete after remediation (including when the accepted plan is still valid, except when available user input can resolve it). Report the remaining gaps with evidence and hand them over to the next remediation step
        next: reimplement_final
      - condition: The accepted plan's premises, scope, method, or verification capability is defective; changing the plan would enable concrete project-local work, and leaving it unchanged prevents the requirement from being executed or verified (unexecuted, failed, unresolved, or unsupported work alone does not qualify; external-only work is excluded)
        return: need_replan
      - condition: No mandatory work can be executed under the current plan or remediation, and evidence confirms that only an external action or external answer remains, or provides a basis to believe the conditions are incompatible. Report the external constraint and unmet obligations, and pass the final continuation, replanning, or stopping decision to the planning step (choose the user-input route only when a user-input option is available and its answer would unblock the work)
        return: need_replan
      - condition: User input is required
        next: reimplement
        requires_user_input: true
        interactive_only: true
  - name: reimplement_final
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    # runtime.yaml: flash-implement-dynamic/reimplement_final -> profile <t2>
    instruction:
      - $param: reimplementation_instruction
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: reimplementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: The missing implementation or cause investigation was completed and mandatory verification is complete (unrelated pre-existing failures and out-of-scope work do not block completion)
        next: COMPLETE
      - condition: No implementation change was needed and the previously unexecuted mandatory verification is complete (report-only work; excludes any required work that has not been performed)
        next: COMPLETE
      - condition: Implementation, cause investigation, or mandatory verification remains incomplete after remediation (including when the accepted plan is still valid, except when available user input can resolve it). Report the remaining gaps with evidence and pass the continuation decision to the planning step
        return: need_replan
      - condition: The accepted plan's premises, scope, method, or verification capability is defective; changing the plan would enable concrete project-local work, and leaving it unchanged prevents the requirement from being executed or verified (unexecuted, failed, unresolved, or unsupported work alone does not qualify; external-only work is excluded)
        return: need_replan
      - condition: No mandatory work can be executed under the current plan or remediation, and evidence confirms that only an external action or external answer remains, or provides a basis to believe the conditions are incompatible. Report the external constraint and unmet obligations, and pass the final continuation, replanning, or stopping decision to the planning step (choose the user-input route only when a user-input option is available and its answer would unblock the work)
        return: need_replan
      - condition: User input is required
        next: reimplement_final
        requires_user_input: true
        interactive_only: true
