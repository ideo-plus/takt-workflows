name: ddd-rust-default
description: "The builtin default development workflow for Rust code that follows the DDD conventions: the planner declares the domain model changes, the coder applies them before the code, and a DDD reviewer checks the code against the model, the layer rules, and the Rust rules. Builtin facets that conflict with the DDD conventions (backend, CQRS+ES) are not used."
max_steps: 51
initial_step: develop

# Same arguments as the builtin default, with the DDD facets added:
#   planner   : ddd-plan / ddd-replan declare the changes to .ddd.toml and docs/ddd/*.yaml
#   coder     : ddd-implement / ddd-reimplement apply them before the code
#   reviewers : ddd-review replaces the backend and CQRS+ES reviewers with a DDD reviewer
# The builtin architecture knowledge stays; the ddd-domain-packaging policy states where DDD takes precedence.

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: ddd-implement
      remediation_workflow: ddd-remediation
      reviewer_suite: ddd-review
      plan_instruction: ddd-plan
      plan_report_format: scenario-based-plan
      replan_instruction: ddd-replan
      plan_policy:
        - design-planning
        - ddd-domain-model
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
      plan_knowledge:
        - architecture
        - task-decomposition
        - ddd-modeling
        - ddd-rust
      testing_instruction: ddd-write-tests
      testing_report_format: scenario-based-test-report
      # Apply business Module grouping to test types and placement too.
      testing_policy:
        - coding
        - testing
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - ddd-modeling
        - ddd-rust
      development_policy:
        - coding
        - testing
        - ai-antipattern
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-use-case-layer
        - ddd-interface-adapter-layer
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      development_knowledge:
        - architecture
        - implementation-semantics
        - ddd-modeling
        - ddd-rust
      implementation_instruction: ddd-implement
      reimplementation_instruction: ddd-reimplement
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      review_policy_additions:
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-use-case-layer
        - ddd-interface-adapter-layer
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      review_policy:
        - coding
        - testing
        - review
        - architecture
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-use-case-layer
        - ddd-interface-adapter-layer
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - ddd-modeling
        - ddd-rust
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
